[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uxrd-phasemap-id13"
version = "0.1.0"
description = "Unsupervised phase mapping of scanning micro-XRD data (synchrotron) with baseline removal, PCA/NMF and clustering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mingfeng Xu" }]
keywords = ["synchrotron", "x-ray diffraction", "micro-XRD", "machine learning", "clustering", "NMF", "pyFAI"]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-learn>=1.1",
  "h5py>=3.6",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
integrate = ["pyFAI>=2023.1", "hdf5plugin>=4", "fabio>=2022"]

[project.scripts]
uxrd-phasemap-id13 = "uxrd_phasemap_id13.cli:main"
uxrd-phasemap-id13-integrate = "uxrd_phasemap_id13.integrate:main"
uxrd-phasemap-id13-viewer = "uxrd_phasemap_id13.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
